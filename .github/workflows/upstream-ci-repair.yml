name: HCAI upstream CI repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: hcai-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify PR and collect failed logs
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: bash .github/upstream-sync/prepare-repair.sh
      - name: Repair failed CI
        if: steps.target.outputs.run == 'true'
        uses: openai/codex-action@v1
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
        with:
          openai-api-key: ${{ secrets.CODEX_PROVIDER_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: high
          sandbox: workspace-write
          allow-bots: true
          prompt-file: .github/codex/ci-repair.md
      - name: Commit repair
        if: steps.target.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/upstream-sync/commit-repair.sh
      - uses: actions/create-github-app-token@v2
        if: steps.target.outputs.run == 'true'
        id: app
        with:
          app-id: ${{ vars.HCAI_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.HCAI_AUTOMATION_APP_PRIVATE_KEY }}
      - name: Push repair
        if: steps.target.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/upstream-sync/push-repair.sh
