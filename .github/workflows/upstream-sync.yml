name: HCAI upstream candidate

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag (empty means latest stable release)
        required: false
        type: string
      resume_sha:
        description: Existing candidate commit SHA to reopen after a PR creation failure
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hcai-upstream-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Select immutable upstream release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RESUME_SHA: ${{ inputs.resume_sha }}
        run: bash .github/upstream-sync/prepare.sh
      - name: Resolve conflicts and review HCAI behavior
        if: steps.target.outputs.run == 'true'
        uses: openai/codex-action@v1
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
        with:
          openai-api-key: ${{ secrets.CODEX_PROVIDER_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: high
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: wangya-hcai-sub2api-automation
          prompt-file: .github/codex/upstream-merge.md
      - name: Validate and commit merge
        id: validate_initial
        if: steps.target.outputs.run == 'true'
        continue-on-error: true
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
        run: |
          set -o pipefail
          bash .github/upstream-sync/commit-candidate.sh 2>&1 | tee /tmp/hcai-candidate-validation.log
      - name: Repair candidate validation (attempt 1)
        if: steps.target.outputs.run == 'true' && steps.validate_initial.outcome == 'failure'
        uses: openai/codex-action@v1
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
        with:
          openai-api-key: ${{ secrets.CODEX_PROVIDER_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: high
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: wangya-hcai-sub2api-automation
          prompt-file: .github/codex/candidate-validation-repair.md
      - name: Revalidate candidate (attempt 1)
        id: validate_retry_1
        if: steps.target.outputs.run == 'true' && steps.validate_initial.outcome == 'failure'
        continue-on-error: true
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
        run: |
          set -o pipefail
          bash .github/upstream-sync/commit-candidate.sh 2>&1 | tee /tmp/hcai-candidate-validation.log
      - name: Repair candidate validation (attempt 2)
        if: steps.target.outputs.run == 'true' && steps.validate_retry_1.outcome == 'failure'
        uses: openai/codex-action@v1
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
        with:
          openai-api-key: ${{ secrets.CODEX_PROVIDER_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: high
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: wangya-hcai-sub2api-automation
          prompt-file: .github/codex/candidate-validation-repair.md
      - name: Revalidate candidate (attempt 2)
        id: validate_retry_2
        if: steps.target.outputs.run == 'true' && steps.validate_retry_1.outcome == 'failure'
        continue-on-error: true
        env:
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
        run: |
          set -o pipefail
          bash .github/upstream-sync/commit-candidate.sh 2>&1 | tee /tmp/hcai-candidate-validation.log
      - name: Require successful candidate validation
        if: steps.target.outputs.run == 'true'
        env:
          INITIAL: ${{ steps.validate_initial.outcome }}
          RETRY_1: ${{ steps.validate_retry_1.outcome }}
          RETRY_2: ${{ steps.validate_retry_2.outcome }}
        run: |
          [[ "$INITIAL" == success || "$RETRY_1" == success || "$RETRY_2" == success ]] || {
            echo 'Candidate validation failed after two AI repair attempts' >&2
            exit 1
          }
      - uses: actions/create-github-app-token@v2
        if: steps.target.outputs.run == 'true' || steps.target.outputs.run == 'resume'
        id: app
        with:
          app-id: ${{ vars.HCAI_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.HCAI_AUTOMATION_APP_PRIVATE_KEY }}
      - name: Push candidate and open PR
        if: steps.target.outputs.run == 'true' || steps.target.outputs.run == 'resume'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HCAI_VERSION: ${{ steps.target.outputs.version }}
          UPSTREAM_SHA: ${{ steps.target.outputs.upstream_sha }}
          UPSTREAM_URL: ${{ steps.target.outputs.release_url }}
          CANDIDATE_BRANCH: ${{ steps.target.outputs.branch }}
        run: bash <(git show "$GITHUB_SHA:.github/upstream-sync/open-candidate.sh")
