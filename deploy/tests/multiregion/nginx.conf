events {}

http {
  access_log off;
  proxy_connect_timeout 2s;
  proxy_read_timeout 180s;
  proxy_send_timeout 30s;

  upstream japan_nodes {
    zone japan_nodes 64k;
    server jp-01:8080 max_fails=1 fail_timeout=2s;
    server jp-02:8080 max_fails=1 fail_timeout=2s;
  }

  upstream us_node {
    server us-01:8080;
  }

  upstream taiwan_node {
    server tw-01:8080;
  }

  server {
    listen 8080 default_server;
    server_name jp.sub2api.test;

    location / {
      proxy_pass http://japan_nodes;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      add_header X-Sub2API-Upstream $upstream_addr always;
    }
  }

  server {
    listen 8080;
    server_name us.sub2api.test;

    location / {
      proxy_pass http://us_node;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Sub2API-Upstream $upstream_addr always;
    }
  }

  server {
    listen 8080;
    server_name tw.sub2api.test;

    location / {
      proxy_pass http://taiwan_node;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Sub2API-Upstream $upstream_addr always;
    }
  }
}
